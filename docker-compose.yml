version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reactive-ticketing-app
    ports:
      - "8080:8080"
    environment:
      TICKETING_RESERVATION_HOLD: PT10M
      TICKETING_QUEUE_RETRY_ATTEMPTS: 3
      TICKETING_CONSUMER_CONCURRENCY: 4
      TICKETING_EXPIRATION_CHECK_INTERVAL_MS: 30000
    depends_on:
      - dynamodb-local
      - localstack

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: reactive-ticketing-dynamodb
    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"
    ports:
      - "8000:8000"

  localstack:
    image: localstack/localstack:latest
    container_name: reactive-ticketing-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: 0
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d
